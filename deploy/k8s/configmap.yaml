apiVersion: v1
kind: ConfigMap
metadata:
  name: video-platform-config
  namespace: default
  labels:
    app: video-platform
data:
  # 数据库（非敏感部分）
  DB_HOST: "mysql.default.svc.cluster.local"
  DB_PORT: "3306"
  DB_USER: "video_user"
  DB_NAME: "video_platform"

  # Redis
  REDIS_HOST: "redis.default.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # MinIO
  MINIO_ENDPOINT: "minio.default.svc.cluster.local:9000"
  MINIO_BUCKET: "videos"
  MINIO_USE_SSL: "false"

  # 服务注册与发现
  ETCD_ENDPOINTS: "etcd.default.svc.cluster.local:2379"
  ETCD_ADDRESS: "etcd.default.svc.cluster.local:2379"

  # Kafka
  KAFKA_BROKERS: "kafka.default.svc.cluster.local:9092"
  KAFKA_GROUP_ID: "transcode-consumer-group"
  KAFKA_TOPIC: "video.transcode.requested"

  # HTTP
  HTTP_PORT: "8080"
