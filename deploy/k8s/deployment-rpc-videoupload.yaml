apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpc-videoupload
  namespace: default
  labels:
    app: rpc-videoupload
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rpc-videoupload
  template:
    metadata:
      labels:
        app: rpc-videoupload
    spec:
      containers:
        - name: rpc-videoupload
          image: video-platform/rpc-videoupload:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: video-platform-config
            - secretRef:
                name: video-platform-secret
          env:
            - name: RPC_PORT
              value: "8888"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rpc-videoupload
  namespace: default
  labels:
    app: rpc-videoupload
spec:
  type: ClusterIP
  selector:
    app: rpc-videoupload
  ports:
    - name: rpc
      port: 8888
      targetPort: 8888
      protocol: TCP
